    <section class="contacto">
      <h2>Contáctanos</h2>

      <form>
        <label>Nombre</label>
        <input type="text" />

        <label>Apellidos</label>

        <label>Correo electrónico</label>

        <label>Sexo</label>

          <option>Seleccione</option>
          <option>Masculino</option>
          <option>Femenino</option>
        </select>

        <label>Dirección</label>
        <input type="text" />

        <input type="submit" value="Enviar" />
      </form>
    </section>
